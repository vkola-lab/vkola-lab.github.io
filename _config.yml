# ------------------------------------------------------------------
# Kolachalama Laboratory website — site settings
# Restart `bundle exec jekyll serve` after editing this file.
# ------------------------------------------------------------------

title: Kolachalama Laboratory
short_title: Kolachalama Lab
tagline: Multimodal AI for neurodegenerative disease and human health
description: >-
  The Kolachalama Laboratory at Boston University develops multimodal AI for
  dementia diagnosis, biomarker assessment, neuroimaging, digital pathology,
  and medical language models.
url: "https://vkola-lab.github.io"
baseurl: ""
lang: en_US

# Used by jekyll-seo-tag for social previews
logo: /images/og-image.jpg
image: /images/og-image.jpg
twitter:
  username: vkola_lab
  card: summary_large_image
social:
  name: Kolachalama Laboratory
  links:
    - https://github.com/vkola-lab
    - https://twitter.com/vkola_lab

# Links used across the site
github_org: https://github.com/vkola-lab
scholar_url: https://scholar.google.com/citations?hl=en&user=YgjYrrcAAAAJ&view_op=list_works&sortby=pubdate
pubmed_url: https://pubmed.ncbi.nlm.nih.gov/?term=kolachalama+vb&filter=other.excludepreprints&sort=date
wiki_url: https://vkolawiki.bu.edu/
# Optional public contact email for the PI, shown on /contact/. Leave blank to hide.
pi_email: ""

# Optional: Google Analytics 4 measurement ID (e.g. G-XXXXXXXXXX). Leave blank to disable.
google_analytics: ""

# Microsoft Clarity project ID (clarity.microsoft.com). Leave blank to disable.
clarity_id: "yogw5a8ohq"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - code
  - vendor
  - .sass-cache

# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  parse_block_html: true

defaults:
  - scope:
      path: "team"
    values:
      layout: member
