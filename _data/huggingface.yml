# Public Hugging Face resources shown on /tools/. Only list public repos. Add a `spaces:` list here to show demos.
models:
  - name: PodGPT models
    repo: vkola-lab?search_models=PodGPT
    label: vkola-lab/PodGPT-*
    description: PodGPT fine-tuned from Llama 3.1/3.2, Gemma 2 and Mixtral, from 1B to 70B parameters.
datasets:
  - name: NLM LitArch open-access textbooks
    repo: datasets/vkola-lab/NLM-LitArch-Open-Access-Subset-Textbooks
    label: vkola-lab/NLM-LitArch-…-Textbooks
    description: 8,226 open-access medical textbooks used for agentic medical retrieval.
  - name: PubMed Central articles
    repo: datasets/vkola-lab/PubMed-Central-Articles
    label: vkola-lab/PubMed-Central-Articles
    description: Creative Commons research articles from leading biomedical journals.
  - name: ClinicalTrials.gov records
    repo: datasets/vkola-lab/ClinicalTrials.gov
    label: vkola-lab/ClinicalTrials.gov
    description: Processed records of completed clinical trials.
