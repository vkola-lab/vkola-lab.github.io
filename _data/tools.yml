- repo: python_speech_features_cuda
  name: Speech features on GPU
  description: A re-implementation of Python Speech Features with GPU acceleration.
  theme: digital

- repo: medaihack
  name: Medical AI Hackathon
  description: Teaching materials from our medical AI hackathon.
