- repo: hbm2024
  name: Disease-driven domain generalization
  description: Domain generalization for neuroimaging-based assessment of Alzheimer's disease.
  theme: dementia

- repo: azrt2021
  name: Dementia detection from voice
  description: Deep learning on voice recordings from the Framingham Heart Study to detect dementia.
